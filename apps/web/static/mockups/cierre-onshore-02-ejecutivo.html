<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cierre Onshore · Ejecutivo</title>
<style>
  :root{
    --bg:#06121F; --panel:#0E2237; --panel2:#13304b; --line:#1c344e;
    --tx:#FFFFFF; --mut:#9CB0C6; --cyan:#00D4FF;
    --pos:#00C896; --posBg:rgba(0,200,150,.15);
    --neg:#FF5252; --negBg:rgba(255,82,82,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#06121F 0%,#0A1929 100%);color:var(--tx);font-family:-apple-system,Inter,Segoe UI,Roboto,sans-serif;max-width:430px;margin:0 auto;padding:14px 12px 28px;font-size:13px}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--mut)}
  .pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill.pos{background:var(--posBg);color:var(--pos)}
  .pill.neg{background:var(--negBg);color:var(--neg)}
  .head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .head .brand{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:700}
  .head .ts{font-size:10px;color:var(--mut);text-align:right;line-height:1.3}
  .head .ts strong{color:#fff;display:block;font-size:12px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
  .stitle{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--mut);margin-bottom:10px;text-transform:uppercase}
  .stitle .ico{color:var(--cyan)}
  .fxgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .fxbox{background:var(--panel2);border-radius:8px;padding:7px 9px}
  .fxbox .l{font-size:9px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
  .fxbox .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .fxbox .d{font-size:10px;font-variant-numeric:tabular-nums;margin-top:1px}
  .bcra{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bcra .b{background:var(--panel2);border-radius:10px;padding:10px 11px}
  .bcra .lbl{font-size:9px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
  .bcra .num{font-size:20px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .bcra .dlt{margin-top:4px}
  .lst .r{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .lst .r:last-child{border-bottom:none}
  .lst .t{font-weight:700;font-size:13px;letter-spacing:.04em;min-width:54px}
  .lst .mid{flex:1;text-align:right;font-size:10px;color:var(--mut);padding-right:10px;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tab{flex:1;text-align:center;padding:6px 0;font-size:10px;letter-spacing:.16em;border-radius:8px;background:var(--panel2);color:var(--mut);cursor:pointer;font-weight:600;text-transform:uppercase;border:1px solid transparent;transition:all .15s}
  .tab.on{background:transparent;border-color:var(--cyan);color:var(--cyan)}
  .grp{display:none} .grp.on{display:block}
  .grp h4{font-size:9px;letter-spacing:.16em;color:var(--cyan);margin:6px 0 2px;text-transform:uppercase}
  .footer{text-align:center;font-size:9px;color:var(--mut);letter-spacing:.16em;margin-top:14px}
</style>
</head>
<body>
<div class="head">
  <span class="brand">◆ CIERRE ONSHORE</span>
  <div class="ts"><strong>17:00 ARS</strong>29 MAY 2026</div>
</div>

<section>
  <div class="stitle"><span>Dólares</span><span class="ico">USD/ARS</span></div>
  <div class="fxgrid" id="fx"></div>
</section>

<section>
  <div class="stitle"><span>BCRA</span><span class="ico">●</span></div>
  <div class="bcra">
    <div class="b">
      <div class="lbl">Reservas</div>
      <div class="num" id="res"></div>
      <div class="dlt" id="resd"></div>
    </div>
    <div class="b">
      <div class="lbl">Riesgo País</div>
      <div class="num" id="rp"></div>
      <div class="dlt" id="rpd"></div>
    </div>
  </div>
</section>

<section>
  <div class="stitle"><span>Acciones MERVAL</span></div>
  <div class="tabs">
    <div class="tab on" data-t="g">Ganadores</div>
    <div class="tab" data-t="p">Perdedores</div>
  </div>
  <div class="lst grp on" id="acc-g"></div>
  <div class="lst grp" id="acc-p"></div>
</section>

<section>
  <div class="stitle"><span>Soberanos</span><span class="ico">TIR</span></div>
  <div class="tabs">
    <div class="tab on" data-s="globales">Globales</div>
    <div class="tab" data-s="bonares">Bonares</div>
    <div class="tab" data-s="bopreales">Bopreales</div>
  </div>
  <div class="grp on" id="sov-globales"></div>
  <div class="grp" id="sov-bonares"></div>
  <div class="grp" id="sov-bopreales"></div>
</section>

<section>
  <div class="stitle"><span>Renta Fija</span></div>
  <div class="tabs">
    <div class="tab on" data-r="cer">CER</div>
    <div class="tab" data-r="lecaps">LECAPS</div>
    <div class="tab" data-r="tamar">TAMAR</div>
  </div>
  <div class="grp on" id="rf-cer"></div>
  <div class="grp" id="rf-lecaps"></div>
  <div class="grp" id="rf-tamar"></div>
</section>

<section>
  <div class="stitle"><span>Futuros DLR</span><span class="ico">ROFEX</span></div>
  <div class="lst" id="fut"></div>
</section>

<div class="footer">BALANZ · DATOS CON FINES INFORMATIVOS · 29 MAY 2026</div>

<script src="_mock-data.js"></script>
<script>
const M = window.MOCK_DATA, F = window.fmt;
const pill = d => `<span class="pill ${F.cls(d)}">${F.arrow(d)} ${F.pct(d)}</span>`;
const pillInv = d => `<span class="pill ${F.cls(-d)}">${F.arrow(-d)} ${F.pct(d)}</span>`;

const fx = document.getElementById("fx");
M.dolares.forEach(d=>{
  fx.insertAdjacentHTML("beforeend",
   `<div class="fxbox"><div class="l">${d.tipo}</div><div class="v">$${F.num(d.precio,0)}</div><div class="d">${pill(d.delta)}</div></div>`);
});

document.getElementById("res").textContent = "US$ " + (M.bcra.reservas_usd_mm/1000).toFixed(2) + " B";
document.getElementById("resd").innerHTML  = pill(M.bcra.reservas_delta_usd_mm/M.bcra.reservas_usd_mm*100);
document.getElementById("rp").textContent  = M.bcra.riesgo_pais_bps + " pb";
document.getElementById("rpd").innerHTML   = pillInv(M.bcra.riesgo_pais_delta_bps);

function listStocks(arr,id){
  const el=document.getElementById(id);
  arr.forEach(s=>el.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${s.ticker}</span><span class="mid">$${F.num(s.precio,0)} · 1M ${F.pct(s.mes)} · YTD ${F.pct(s.ytd)}</span>${pill(s.hoy)}</div>`));
}
listStocks(M.acciones.ganadores,"acc-g");
listStocks(M.acciones.perdedores,"acc-p");

function listBonds(panel,id){
  const el=document.getElementById(id);
  const both = [
    ...panel.ganadores.map(b=>({...b,_t:"sube"})),
    ...panel.perdedores.map(b=>({...b,_t:"baja"}))
  ];
  both.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  both.slice(0,5).forEach(b=>el.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${b.ticker}</span><span class="mid">TIR ${F.num(b.tir)}%</span>${pillInv(b.delta)}</div>`));
}
listBonds(M.soberanos.globales,"sov-globales");
listBonds(M.soberanos.bonares,"sov-bonares");
listBonds(M.soberanos.bopreales,"sov-bopreales");

(function(){
  const el=document.getElementById("rf-cer");
  [...M.renta_fija.cer.ganadores,...M.renta_fija.cer.perdedores].slice(0,5).forEach(b=>el.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${b.ticker}</span><span class="mid">TIR ${F.num(b.tir)}%</span>${pillInv(b.delta)}</div>`));
})();
(function(){
  const el=document.getElementById("rf-lecaps");
  [...M.renta_fija.lecaps.ganadores,...M.renta_fija.lecaps.perdedores].slice(0,5).forEach(b=>el.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${b.ticker}</span><span class="mid">TEM ${F.num(b.tem)}% · TNA ${F.num(b.tna)}%</span>${pillInv(b.delta)}</div>`));
})();
(function(){
  const el=document.getElementById("rf-tamar");
  [...M.renta_fija.tamar_puro.ganadores,...M.renta_fija.tamar_puro.perdedores].slice(0,5).forEach(b=>el.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${b.ticker}</span><span class="mid">TIR ${F.num(b.tir)}%</span>${pillInv(b.delta)}</div>`));
})();

const fut = document.getElementById("fut");
M.futuros.forEach(f=>fut.insertAdjacentHTML("beforeend",
   `<div class="r"><span class="t">${f.contrato}</span><span class="mid">$${F.num(f.precio,0)} · TNA ${F.num(f.tna)}%</span>${pill(f.delta)}</div>`));

// Tabs
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    const tabs = [...t.parentElement.children];
    tabs.forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    const groups = t.parentElement.parentElement.querySelectorAll(":scope > .grp");
    let idx = tabs.indexOf(t);
    groups.forEach((g,i)=>g.classList.toggle("on", i===idx));
  });
});
</script>
</body>
</html>
