<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curva Soberana · Balanz</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Estilos especificos de la pagina de prueba de curva */
    .curva-wrapper {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px 24px;
    }
    .panel-chart {
      padding: 16px 20px 20px;
      background: var(--panel-bg);
    }
    .chart-container {
      position: relative;
      height: 540px;
      width: 100%;
    }
    /* Boton "Volver al monitor" como link */
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="brand-block">
      <div class="logo-balanz">BALANZ</div>
      <div class="brand-text">
        <span class="brand-monitor">CURVA SOBERANA</span>
        <span class="brand-date" id="brand-date">—</span>
      </div>
    </div>

    <div class="live-block loading" id="live-block">
      <div class="live-row">
        <span class="live-dot"></span>
        <span class="live-label">EN VIVO</span>
      </div>
      <span class="live-time">Última actualización <span id="live-time">—</span> hs</span>
    </div>

    <div class="actions">
      <a class="btn" href="/">Volver al Monitor</a>
    </div>
  </header>

  <main class="curva-wrapper">
    <section class="panel">
      <div class="panel-header">
        <h2>CURVA SOBERANA</h2>
        <span class="panel-sub" id="curva-sub">11 bonos AL/GD · TIR vs Duration Modificada</span>
        <span class="panel-ts" id="curva-ts">—</span>
      </div>
      <div class="panel-body panel-chart">
        <div class="chart-container">
          <canvas id="curva-chart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    Datos en tiempo real · Refinitiv · refresh cada 30s
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="/static/curva.js"></script>
</body>
</html>
